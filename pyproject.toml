[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-recruitment-agent"
version = "0.1.0"
description = "An agent that runs the top of the hiring funnel — a human still decides."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Osaid Khan" }]

dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.3.0",
    "pydantic>=2.5.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40.0", "pandas>=2.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
recruiter = "recruiter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
